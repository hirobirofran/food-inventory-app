# Dependabot の定期更新（Issue #51）
# - 新しいバージョンの確認は週 1 回（月曜 09:00 Asia/Tokyo）。npm はメジャー更新も含めて全部 1 本の PR、GitHub Actions も全部 1 本の PR にまとめる
# - 脆弱性の修正 PR（security updates）はこの設定と無関係に、アラートが出た時点で作られる（まとめない）
# - cooldown 7 日: 公開直後のバージョンを取り込まないための待ち時間（脆弱性の修正 PR には効かない）
# - メジャー更新で CI やプレビューに問題が出たら、Dependabot のブランチにコミットを足して直す
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Tokyo'
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'chore(deps)'
    groups:
      npm:
        patterns:
          - '*'
    ignore:
      # typescript-eslint（eslint-config-next 経由）が TypeScript 7 に未対応で lint が止まるため、typescript のメジャー更新だけ見送る。
      # 対応したら外す（Issue #62）。1 パッケージ限定で、他のメジャー更新は受け取る
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # @types/node は実行環境（.nvmrc と engines.node の Node 24）に合わせる。Node 26 にしかない API を型検査で通さないため。
      # Node を上げるときは .nvmrc・engines.node と一緒にこの範囲も上げる
      - dependency-name: '@types/node'
        versions: ['>=25']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Tokyo'
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'chore(ci)'
    groups:
      github-actions:
        patterns:
          - '*'
