name: Terraform apply

# main に入った infra/terraform の GCP の設定を、オーナーの承認の後に apply する（Issue #84）。
# PR の plan は terraform-plan.yml が行う。apply 用 SA と、apply に要る Secrets と権限は、このファイルにだけ書く。
# 動き方と、失敗したときに全文を読む手順は docs/SETUP.md の 7 章。
#
# ログの決まり: 公開リポジトリの Actions のログは、GitHub にログインした人なら誰でも読める。
# Secrets の値は *** になるが、Terraform が GCP から読んだ値（SA の数字の ID など）はそのまま出る。
# そのため Terraform の出力（init・plan・show・apply）は全部ファイルに書いてログのバケットに上げ、
# Actions のログには「要約（plan-summary.jq）」「成功か失敗か」「全文の置き場所」だけを出す。
# plan のファイル（tfplan）は値を全部含むので、成果物にしない
#
# Actions はコミット ID で固定し、版をコメントで添える（Issue #82 の決定）

on:
  push:
    branches: [main]
    paths:
      - 'infra/terraform/**'
      # apply の手順そのものを変えたときも、main に入った直後に一度動かして確かめる
      - '.github/workflows/terraform-apply.yml'

permissions:
  contents: read
  # WIF で GCP に入るときに使う、GitHub の OIDC トークン
  id-token: write

# apply は 1 本ずつ走らせる。走っている apply（承認待ちを含む）は取り消さない。
# 待てる実行は既定では 1 本だけで、さらに次の実行が来ると、待っていたほうが取り消される。
# queue: max で、待てる数を最大 100 本にする（docs/SETUP.md の 7-1）。
# plan（terraform-plan.yml）とは別のグループなので、PR の plan を待たせない
concurrency:
  group: terraform-apply
  cancel-in-progress: false
  queue: max

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  # 識別子はすべて Secrets から渡す（docs/SETUP.md の 6-4）
  TF_VAR_gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
  TF_VAR_app_sa_email: ${{ secrets.APP_SA_EMAIL }}
  TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
  LOG_BUCKET: ${{ secrets.LOG_BUCKET }}

jobs:
  apply:
    # 既定の 6 時間だと、GCP が応答しないときに concurrency のグループを長くふさぐ。承認待ちの時間は含まない
    timeout-minutes: 30
    runs-on: ubuntu-latest
    # オーナーが承認してから動く。名前は大文字と小文字も同じにする（違うと apply 用 SA を借りられない）
    environment: terraform-apply
    defaults:
      run:
        shell: bash
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 古い実行を動かし直したときや、承認の順番が前後したときに、新しいコミットで入れた変更を
      # 古い設定で戻さないように、infra/terraform の中身とこのファイル（terraform-apply.yml）が、
      # 今の main の先頭と同じかを、最初に確かめる。このファイルも比べるのは、Secrets の渡し方などの
      # ワークフローの設定も、古いまま apply しないため。
      # コミットそのものではなく中身を比べるのは、Terraform を変えないコミット（アプリの変更など）は
      # この apply を動かさないため。先頭のコミットと比べると、その後にアプリの PR がマージされただけで
      # どの apply も動かなくなる。認証も Terraform も要らないので最初に確かめ、違えば後の手順は全部飛ばす。
      # git の出力（リポジトリの URL やコミット ID）はログに出さない
      - id: latest
        name: main の先頭と同じ設定かを確かめる
        run: |
          if ! git fetch --no-tags --depth=1 origin refs/heads/main >/dev/null 2>&1 \
            || ! main_ids=$(git rev-parse FETCH_HEAD:infra/terraform FETCH_HEAD:.github/workflows/terraform-apply.yml 2>/dev/null) \
            || ! this_ids=$(git rev-parse "${GITHUB_SHA}:infra/terraform" "${GITHUB_SHA}:.github/workflows/terraform-apply.yml" 2>/dev/null); then
            echo "main の先頭を取れなかったので適用しない"
            exit 1
          fi
          if [ "$main_ids" = "$this_ids" ]; then
            echo "same=true" >>"$GITHUB_OUTPUT"
            echo "main の先頭と同じ設定: はい"
          else
            echo "same=false" >>"$GITHUB_OUTPUT"
            echo "main の先頭と、infra/terraform の中身か terraform-apply.yml が違うので適用しない（より新しいコミットの apply が反映する）"
          fi

      # Terraform 本体の版は、infra/terraform/versions.tf の required_version にだけ書き、ここで読み出す
      - id: tfver
        name: Terraform の版を読む
        if: steps.latest.outputs.same == 'true'
        run: |
          version=$(sed -nE 's/^[[:space:]]*required_version[[:space:]]*=[[:space:]]*"=[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' versions.tf)
          if [ -z "$version" ]; then
            echo "versions.tf の required_version から、Terraform の版（= の後の版）を読めなかった"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "Terraform の版: $version"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.latest.outputs.same == 'true'
        with:
          terraform_version: ${{ steps.tfver.outputs.version }}
          # ラッパーは Terraform の出力をログとステップの出力に出すので使わない
          terraform_wrapper: false

      # プロジェクト番号だけを値に持つ Secret は無いので、WIF のプロバイダの名前
      # （projects/<番号>/locations/...）から取り出して伏せ字にする。auth が失敗したときの
      # エラーに、プールの名前などの形で番号が出ても *** になるように
      - name: プロジェクト番号を伏せる
        if: steps.latest.outputs.same == 'true'
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
        run: echo "::add-mask::$(cut -d/ -f2 <<<"$WIF_PROVIDER")"

      - name: GCP に入る
        if: steps.latest.outputs.same == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.TF_APPLY_SA }}

      - id: init
        name: init
        if: steps.latest.outputs.same == 'true'
        run: |
          if terraform init -no-color -backend-config="bucket=${TF_STATE_BUCKET}" >"$RUNNER_TEMP/terraform.txt" 2>&1; then
            echo "init: 成功"
          else
            echo "init: 失敗（全文は下の「全文を上げる」の置き場所）"
            exit 1
          fi

      - name: plan
        if: steps.latest.outputs.same == 'true'
        run: |
          log="$RUNNER_TEMP/terraform.txt"
          # apply の直前にもう一度 plan し、その要約を出してから、同じ plan をそのまま apply する
          if terraform plan -no-color -out=tfplan >>"$log" 2>&1 \
            && terraform show -json tfplan 2>>"$log" | jq -r -f plan-summary.jq 2>>"$log"; then
            echo "plan: 成功"
          else
            echo "plan: 失敗（全文は下の「全文を上げる」の置き場所）"
            exit 1
          fi

      - name: apply
        # 条件が無いと、前のステップが飛ばされても（成功扱い）このステップは動き、tfplan が無くて失敗する
        if: steps.latest.outputs.same == 'true'
        run: |
          if terraform apply -no-color tfplan >>"$RUNNER_TEMP/terraform.txt" 2>&1; then
            echo "apply: 成功"
          else
            echo "apply: 失敗（全文は下の「全文を上げる」の置き場所）"
            exit 1
          fi

      - name: 全文を上げる
        # init まで進んでいれば、plan や apply が失敗しても上げる
        if: always() && steps.init.outcome != 'skipped'
        # アップロードに失敗したら、ジョブを失敗にする（error）。apply は GCP を変えるので、
        # 記録が残らないことに気づけるようにするため。失敗の理由の出し方は upload-log.sh
        run: bash upload-log.sh apply error
