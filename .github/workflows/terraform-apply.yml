name: Terraform apply

# plan（terraform-plan.yml）と apply をファイルで分けるのは、PR ごとに動く plan のファイルに、
# apply 用 SA とその Secrets を書かないため。また、plan のファイルの変更が apply の動きに影響しないようにするため。
# apply 用 SA を守る境目は Environment terraform-apply で、ファイルを分けるのはその上の守り（docs/SETUP.md の 7 章、Issue #84）。
#
# Terraform の出力（init・plan・show・apply）を全部ファイルに書いてログのバケットに上げ、
# Actions のログには要約（plan-summary.jq）・成功か失敗か・全文の置き場所だけを出す。
# 公開リポジトリの Actions のログは、GitHub にログインした人なら誰でも読めるため。
# Secrets の値は *** になるが、Terraform が GCP から読んだ値（SA の数字の ID など）はそのまま出る。
# plan のファイル（tfplan）を成果物にしないのは、値を全部含むため。
#
# Actions をコミット ID で固定するのは、版のタグが後から別のコミットに付け替えられ、同じ版の表記のまま中身が変わりうるため。
# 版をコメントで添えるのは、ID だけではどの版か読めないため（Issue #82 の決定）。

on:
  push:
    branches: [main]
    paths:
      - 'infra/terraform/**'
      # apply のファイルの変更でも動かすのは、apply の手順の変更を、main に入った直後に一度動かして確かめるため
      - '.github/workflows/terraform-apply.yml'

permissions:
  contents: read
  # WIF で GCP に入るには、GitHub の OIDC トークンが要る
  id-token: write

# apply を 1 つのグループで 1 本ずつにするのは、2 本が同時に動くと、state のロックを取り合って片方が失敗するため。
# 走っている apply を取り消さないのは、途中で止めると、GCP の変更が途中で止まり、state のロックが残ることがあるため。
# queue: max にするのは、既定では待てる実行が 1 本だけで、次の実行が来ると待っていた apply が取り消されるため（docs/SETUP.md の 7-1）。
# plan（terraform-plan.yml）と別のグループにするのは、承認待ちの apply が PR の plan を止めないようにするため
concurrency:
  group: terraform-apply
  cancel-in-progress: false
  queue: max

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  # 識別子を Secrets から渡すのは、公開リポジトリに環境固有の ID を置かないため。Secrets の値は、ログで *** になる（docs/SETUP.md の 6-4）
  TF_VAR_gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
  TF_VAR_app_sa_email: ${{ secrets.APP_SA_EMAIL }}
  TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
  LOG_BUCKET: ${{ secrets.LOG_BUCKET }}

jobs:
  apply:
    # 既定の 6 時間だと、GCP が応答しないときに concurrency のグループを長くふさぐ。承認待ちの時間は含まない
    timeout-minutes: 30
    runs-on: ubuntu-latest
    # Environment を付けるのは、オーナーが承認するまで、apply 用 SA を借りられないようにするため。
    # 名前の大文字と小文字も合わせるのは、違うと、apply 用 SA を借りる許可の相手と合わなくなるため
    environment: terraform-apply
    defaults:
      run:
        shell: bash
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # main の先頭と比べるのは、古い実行を動かし直したときや承認の順番が前後したときに、新しいコミットの変更を古い設定で戻さないため。
      # このファイル（terraform-apply.yml）も比べるのは、Secrets の渡し方などのワークフローの設定も、古いまま apply しないため。
      # コミットではなく中身を比べるのは、アプリだけを変えたコミットが後に入っても、apply を止めないため。
      # そのコミットは apply を動かさないので、コミットで比べると、どの apply も反映しなくなる。
      # 最初のステップにするのは、認証も Terraform も要らず、違えば GCP に入らずに終われるため。
      # 認証なしで fetch できるのは、公開リポジトリだから（checkout は persist-credentials: false）。非公開にするなら、この fetch に認証を渡す。
      # git のエラーを隠さないのは、出るのが公開されているリポジトリの URL やパスで、隠すと失敗の原因が分からなくなるため
      - id: latest
        name: main の先頭と同じ設定かを確かめる
        run: |
          if ! git fetch --quiet --no-tags --depth=1 origin refs/heads/main \
            || ! main_ids=$(git rev-parse FETCH_HEAD:infra/terraform FETCH_HEAD:.github/workflows/terraform-apply.yml) \
            || ! this_ids=$(git rev-parse "${GITHUB_SHA}:infra/terraform" "${GITHUB_SHA}:.github/workflows/terraform-apply.yml"); then
            echo "main の先頭を取れなかったので適用しない"
            exit 1
          fi
          if [ "$main_ids" = "$this_ids" ]; then
            echo "same=true" >>"$GITHUB_OUTPUT"
            echo "main の先頭と同じ設定: はい"
          else
            echo "same=false" >>"$GITHUB_OUTPUT"
            echo "main の先頭と、infra/terraform の中身か terraform-apply.yml が違うので適用しない（より新しいコミットの apply が反映する）"
          fi

      # 版を versions.tf の required_version から読むのは、版を書く所を 1 か所にして、ワークフローとのずれで init が失敗しないようにするため。
      # 読めるのは "= x.y.z" の形だけ（ADR-0001 の完全一致）で、ほかの形にするとここで止まる
      - id: tfver
        name: Terraform の版を読む
        if: steps.latest.outputs.same == 'true'
        run: |
          version=$(sed -nE 's/^[[:space:]]*required_version[[:space:]]*=[[:space:]]*"=[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' versions.tf)
          if [ -z "$version" ]; then
            echo "versions.tf の required_version から、Terraform の版（= の後の版）を読めなかった"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "Terraform の版: $version"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.latest.outputs.same == 'true'
        with:
          terraform_version: ${{ steps.tfver.outputs.version }}
          # ラッパーは Terraform の出力をログとステップの出力に出すので使わない
          terraform_wrapper: false

      # 伏せるのは、auth が失敗したときのエラーに、プールの名前などの形でプロジェクト番号が出ることがあるため。
      # プロバイダの名前（projects/<番号>/locations/...）から取り出すのは、番号だけを値に持つ Secret が無いため
      - name: プロジェクト番号を伏せる
        if: steps.latest.outputs.same == 'true'
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
        run: echo "::add-mask::$(cut -d/ -f2 <<<"$WIF_PROVIDER")"

      - name: GCP に入る
        if: steps.latest.outputs.same == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.TF_APPLY_SA }}

      - id: init
        name: init
        if: steps.latest.outputs.same == 'true'
        run: |
          if terraform init -no-color -backend-config="bucket=${TF_STATE_BUCKET}" >"$RUNNER_TEMP/terraform.txt" 2>&1; then
            echo "init: 成功"
          else
            echo "init: 失敗（全文は下の「全文を上げる」の置き場所）"
            exit 1
          fi

      - name: plan
        if: steps.latest.outputs.same == 'true'
        run: |
          log="$RUNNER_TEMP/terraform.txt"
          # 承認の後に plan し直すのは、PR の plan の結果ファイルが Terraform の値をすべて含み、公開リポジトリの成果物に残せず、持ち越せないため。
          # 結果ファイル（tfplan）を apply に渡すのは、ログに出した要約と反映する中身を一致させるため。
          # また、plan の後に state が変わっていたら、Terraform が反映せずに止まるため
          if terraform plan -no-color -out=tfplan >>"$log" 2>&1 \
            && terraform show -json tfplan 2>>"$log" | jq -r -f plan-summary.jq 2>>"$log"; then
            echo "plan: 成功"
          else
            echo "plan: 失敗（全文は下の「全文を上げる」の置き場所）"
            exit 1
          fi

      - name: apply
        # 条件が無いと、前のステップが飛ばされても（成功扱い）このステップは動き、tfplan が無くて失敗する
        if: steps.latest.outputs.same == 'true'
        run: |
          if terraform apply -no-color tfplan >>"$RUNNER_TEMP/terraform.txt" 2>&1; then
            echo "apply: 成功"
          else
            echo "apply: 失敗（全文は下の「全文を上げる」の置き場所）"
            exit 1
          fi

      - name: 全文を上げる
        # init が飛ばされたときに上げないのは、全文のファイルを init のステップが作るため。
        # always() にするのは、plan や apply が失敗したときこそ全文が要るため
        if: always() && steps.init.outcome != 'skipped'
        # アップロードに失敗したらジョブを失敗にする（error）のは、apply は GCP を変えるので、
        # 記録が残らないことに気づけるようにするため
        run: bash upload-log.sh apply error
