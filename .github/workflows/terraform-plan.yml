name: Terraform plan

# infra/terraform の GCP の設定を、PR で plan する（Issue #84）。apply は terraform-apply.yml が行う。
# このファイルには、plan 用 SA と、plan に要る Secrets と権限だけを書く。apply 用の物は書かない。
# 動き方と、失敗したときに全文を読む手順は docs/SETUP.md の 7 章。
#
# ログの決まり: 公開リポジトリの Actions のログは、GitHub にログインした人なら誰でも読める。
# Secrets の値は *** になるが、Terraform が GCP から読んだ値（SA の数字の ID など）はそのまま出る。
# そのため Terraform の出力（init・plan・show）は全部ファイルに書いてログのバケットに上げ、
# Actions のログには「要約（plan-summary.jq）」「成功か失敗か」「全文の置き場所」だけを出す。
# fmt と validate の出力はファイルの名前とエラーの箇所だけで、識別子を含まないのでログに出す。
# plan のファイル（tfplan）は値を全部含むので、成果物にしない。plan を PR にコメントしない
#
# Actions はコミット ID で固定し、版をコメントで添える（Issue #82 の決定）

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/terraform-plan.yml'
      # apply の手順を変える PR も、マージの後に apply が動くので、plan を見てからマージする
      - '.github/workflows/terraform-apply.yml'
  # plan を手で動かす。Dependabot の PR を確かめるときに使う:
  # gh workflow run terraform-plan.yml --ref <PR のブランチ>
  workflow_dispatch:

permissions:
  contents: read
  # WIF で GCP に入るときに使う、GitHub の OIDC トークン
  id-token: write

# PR ごとに 1 本だけ走らせ、同じ PR の古い plan は取り消す。github.ref は、PR では
# refs/pull/<PR の番号>/merge、手動の実行では refs/heads/<ブランチ名> になる。
# apply（terraform-apply.yml）とは別のグループなので、別の PR の plan にも、承認待ちの apply にも待たされない
concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

env:
  # infra/terraform/versions.tf の required_version と同じ版
  # （版を上げるときは、versions.tf と、このファイルと terraform-apply.yml の 3 か所を直す）
  TERRAFORM_VERSION: 1.17.2
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  # 識別子はすべて Secrets から渡す（docs/SETUP.md の 6-4）
  TF_VAR_gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
  TF_VAR_app_sa_email: ${{ secrets.APP_SA_EMAIL }}
  TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
  LOG_BUCKET: ${{ secrets.LOG_BUCKET }}

jobs:
  plan:
    # Dependabot が起こした実行と、フォークからの PR の実行には、通常の Secrets が渡らず plan が必ず失敗するので、
    # 動かさない。Dependabot の PR は、上の workflow_dispatch で人が動かす（人が起こした実行には Secrets が渡る）。
    # 手動の実行には pull_request が無いので、2 つ目の条件は github.repository どうしの比較になり、通る
    if: >-
      github.actor != 'dependabot[bot]'
      && (github.event.pull_request.head.repo.full_name || github.repository) == github.repository
    # 既定の 6 時間だと、GCP が応答しないときに runner を長くふさぐ
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          # ラッパーは Terraform の出力をログとステップの出力に出すので使わない
          terraform_wrapper: false

      - name: fmt
        run: terraform fmt -check -recursive -no-color

      # プロジェクト番号だけを値に持つ Secret は無いので、WIF のプロバイダの名前
      # （projects/<番号>/locations/...）から取り出して伏せ字にする。auth が失敗したときの
      # エラーに、プールの名前などの形で番号が出ても *** になるように
      - name: プロジェクト番号を伏せる
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
        run: echo "::add-mask::$(cut -d/ -f2 <<<"$WIF_PROVIDER")"

      - name: GCP に入る
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.TF_PLAN_SA }}

      - id: init
        name: init
        run: |
          if terraform init -no-color -backend-config="bucket=${TF_STATE_BUCKET}" >"$RUNNER_TEMP/terraform.txt" 2>&1; then
            echo "init: 成功"
          else
            echo "init: 失敗（全文は下の「全文を上げる」の置き場所）"
            exit 1
          fi

      - name: validate
        run: terraform validate -no-color 2>&1 | tee -a "$RUNNER_TEMP/terraform.txt"

      - name: plan
        run: |
          log="$RUNNER_TEMP/terraform.txt"
          # plan は state のロックを取らない。plan 用 SA は state を読むだけ（docs/SETUP.md の 6-5）
          if terraform plan -no-color -lock=false -out=tfplan >>"$log" 2>&1 \
            && terraform show -json tfplan 2>>"$log" | jq -r -f plan-summary.jq 2>>"$log"; then
            echo "plan: 成功"
          else
            echo "plan: 失敗（全文は下の「全文を上げる」の置き場所）"
            exit 1
          fi

      - name: 全文を上げる
        # init まで進んでいれば、plan が失敗しても上げる
        if: always() && steps.init.outcome != 'skipped'
        run: |
          object="logs/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-plan.txt"
          err="$RUNNER_TEMP/upload-error.txt"
          # gcloud は runner に入っている。認証は上の auth が書き出した資格情報を使う。
          # gcloud の出力にはバケットの名前や SA のメールアドレスが入るので、そのままは出さない
          if gcloud storage cp "$RUNNER_TEMP/terraform.txt" "gs://${LOG_BUCKET}/${object}" >/dev/null 2>"$err"; then
            echo "全文の置き場所: ログのバケット（Secret の LOG_BUCKET）の ${object}"
          else
            # 標準エラーから、HTTP の状態と権限の名前（storage.objects.get など）だけを抜き出して出す。
            # 「does not have permission to access」は、gcloud が HTTP 403 のときだけ使う決まった文
            status=$(grep -oE 'HTTPError [0-9]{3}|not found: [0-9]{3}' "$err" | grep -oE '[0-9]{3}$' | head -n 1 || true)
            if [ -z "$status" ] && grep -q 'does not have permission to access' "$err"; then status=403; fi
            perms=$(grep -oE 'storage\.[a-z]+\.[a-zA-Z]+' "$err" | grep -v 'googleapis' | sort -u | paste -sd ' ' - || true)
            # plan の成否は上のステップで分かり、全文は plan を動かし直せば作り直せるので、plan のジョブは失敗にしない
            echo "::warning::アップロード失敗（HTTP の状態: ${status:-不明}、エラーに出た権限: ${perms:-なし}）"
          fi
